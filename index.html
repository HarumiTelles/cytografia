<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo: Hash simples</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1020;color:#f2f2f7;display:flex;justify-content:center;padding:24px}
  main{background:#1b1d36;max-width:560px;width:100%;padding:28px;border-radius:14px}
  input{width:100%;padding:12px;border-radius:8px;border:0;font-size:1rem;margin:12px 0}
  .res{font-size:1.4rem;margin:6px 0}
  small{color:#b9b9d0;line-height:1.5;display:block;margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>Hash simples (soma ASCII)</h1>
  <p>Digite uma senha e veja o hash. Teste <b>olecram</b> e <b>marcelo</b>: o resultado é igual (colisão).</p>
  <input id="senha" placeholder="Digite a senha" value="olecram" autocomplete="off">
  <div class="res">Hash simples: <b id="simples">739</b></div>
  <div class="res" style="font-size:.85rem;word-break:break-all">SHA-256: <span id="sha"></span></div>
  <small>Este hash é só didático. Letras em outra ordem geram o mesmo número, então ele é fraco. O SHA-256 é o tipo de hash usado de verdade (junto com "salt").</small>
</main>
<script>
function calculaHash(senha){
  let valor = 0;
  for (const letra of senha) valor += letra.codePointAt(0);
  return valor;
}
async function sha256(texto){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
const campo = document.getElementById("senha");
async function atualiza(){
  document.getElementById("simples").textContent = calculaHash(campo.value);
  document.getElementById("sha").textContent = await sha256(campo.value);
}
campo.addEventListener("input", atualiza);
atualiza();
</script>
</body>
</html>
